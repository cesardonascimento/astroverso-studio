# astroverso-studio — cortes de vídeos para TikTok
# Rodar dentro do WSL:  podman-compose up -d --build
# Portas diferentes da v1 para as duas poderem rodar juntas.

name: astroverso-studio

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_DIR: /data/media
      PROMPTS_DIR: /app/prompts
    volumes:
      - ./data/media:/data/media
      - ./prompts:/app/prompts:ro
      - ./config:/app/config:ro
      # dev: código montado (basta reiniciar o worker após editar)
      - ./worker/app:/app/app:ro
      - ./db/migrations:/app/migrations:ro
      - whisper_models:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8091:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  n8n:
    image: docker.io/n8nio/n8n:stable
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      # os workflows leem estes valores com $env (sem segredo gravado nos workflows)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WORKER_URL: http://worker:8080
      WORKER_TOKEN: ${WORKER_TOKEN}
      BOT_URL: http://bot:8000
      BOT_API_TOKEN: ${BOT_API_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      MEDIA_DIR: /data/media
    volumes:
      - ./data/media:/data/media:ro
      - ./bot/bot.py:/app/bot.py:ro  # dev: basta reiniciar após editar

volumes:
  pgdata:
  whisper_models:
  n8n_data:
