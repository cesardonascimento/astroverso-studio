# Máquina de conteúdo — stack local
# Rodar dentro do WSL (Fedora/elnath):  podman-compose up -d --build
# Todas as portas ficam presas em 127.0.0.1 (acessíveis do Windows via localhost).

name: astroverso-studio-v1

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      # usado pelos workflows para chamar o worker
      WORKER_URL: http://worker:8080
      WORKER_TOKEN: ${WORKER_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_DIR: /data/media
      PROMPTS_DIR: /app/prompts
      CONFIG_DIR: /app/config
    volumes:
      - ./data/media:/data/media
      - ./prompts:/app/prompts:ro
      - ./config:/app/config:ro
      # dev: código montado (basta reiniciar o worker após editar). Remova em produção.
      - ./worker/app:/app/app:ro
      - ./db/migrations:/app/migrations:ro
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  n8n_data:
