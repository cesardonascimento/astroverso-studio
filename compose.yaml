name: astroverso-studio

services:
  db:
    profiles: [storage]
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGPORT: ${DATABASE_PORT}
      TZ: ${TZ}
    volumes:
      - ${DATABASE_DATA_DIR}:/var/lib/postgresql/data:Z
    ports:
      - "${STORAGE_BIND_ADDRESS}:${DATABASE_PORT}:${DATABASE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  s3:
    profiles: [storage]
    image: docker.io/versity/versitygw:v1.11.0
    restart: unless-stopped
    command: ["--port", ":${S3_PORT}", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ${S3_DATA_DIR}:/data:Z
    ports:
      - "${STORAGE_BIND_ADDRESS}:${S3_PORT}:${S3_PORT}"

  studio:
    profiles: [studio]
    build: ./studio
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${WORK_DATA_DIR}:/data/work:Z
      - ./studio/content:/app/content:z
      - whisper_models:/root/.cache/huggingface
    ports:
      - "${STUDIO_PORT}:8080"

volumes:
  whisper_models:
