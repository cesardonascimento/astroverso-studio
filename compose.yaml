# Astroverso Studio
# Base compartilhada (postgres, n8n, ponte com o Discord) + um serviço por módulo (modules/<módulo>).
# Rodar no Linux/WSL:  podman-compose up -d --build

name: astroverso-studio

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # um banco por módulo, criados na primeira inicialização (db/init)
      STUDIO_DATABASES: cortes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.io/n8nio/n8n:stable
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      # os fluxos leem estes valores com $env (nenhum segredo fica gravado nos fluxos)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WORKER_TOKEN: ${WORKER_TOKEN}
      BOT_URL: http://bot:8000
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      CORTES_URL: http://cortes:8080
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      # o bot do Discord é o astroverso-discord; esta é a ponte do cliente studio
      ASTROVERSO_DISCORD_URL: ${ASTROVERSO_DISCORD_URL}
      ASTROVERSO_DISCORD_KEY: ${ASTROVERSO_DISCORD_KEY}
      STUDIO_DISCORD_CHANNEL: ${STUDIO_DISCORD_CHANNEL:-studio}
      # módulo que recebe as mensagens com link no canal
      STUDIO_DEFAULT_MODULE: ${STUDIO_DEFAULT_MODULE:-cortes}
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      MEDIA_DIR: /data
    volumes:
      - ./data:/data:ro
      - ./bot/bot.py:/app/bot.py:ro

  # ---------------------------------------------------------------- módulos
  cortes:
    build: ./modules/cortes
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cortes
      MEDIA_DIR: /data/media
      PROMPTS_DIR: /app/prompts
      N8N_EVENTS_URL: http://n8n:5678/webhook/cortes-events
    volumes:
      - ./data/cortes:/data/media
      - ./modules/cortes/prompts:/app/prompts:ro
      - ./modules/cortes/config:/app/config:ro
      - ./modules/cortes/app:/app/app:ro
      - ./modules/cortes/migrations:/app/migrations:ro
      - whisper_models:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8091:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  n8n_data:
  whisper_models:
