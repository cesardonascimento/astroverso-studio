name: astroverso-studio

services:
  db:
    profiles: [storage]
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATABASE_DATA_DIR}:/var/lib/postgresql/data:Z
    ports:
      - "${STORAGE_BIND_ADDRESS}:${DATABASE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  s3:
    profiles: [storage]
    image: docker.io/versity/versitygw:v1.11.0
    restart: unless-stopped
    command: ["--port", ":7070", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ${S3_DATA_DIR}:/data:Z
    ports:
      - "${STORAGE_BIND_ADDRESS}:${S3_PORT}:7070"
